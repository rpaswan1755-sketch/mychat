<body>

<!-- MOBILE OTP LOGIN -->

<div id="loginScreen"
     style="padding:20px;background:white;min-height:100vh">

  <h2>MyChat Login</h2>
  <p>मोबाइल नंबर से लॉगिन करें</p>

  <label for="loginPhone">मोबाइल नंबर (+91)</label>

  <input
    id="loginPhone"
    type="tel"
    inputmode="tel"
    placeholder="10 अंकों का मोबाइल नंबर"
    maxlength="13"
    style="width:100%;padding:12px;margin:8px 0">

  <div id="recaptcha-container"
       style="margin:12px 0"></div>

  <button id="sendOtpButton"
    onclick="sendOTP()"
    style="padding:12px 20px;background:#128C7E;color:white;border:0;border-radius:6px">
    OTP भेजें
  </button>

  <div id="otpSection" style="display:none">

    <input
      id="loginOTP"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      placeholder="SMS में आया OTP डालें"
      maxlength="6"
      style="width:100%;padding:12px;margin:12px 0">

    <button onclick="verifyOTP()"
      style="padding:12px 20px;background:#128C7E;color:white;border:0;border-radius:6px">
      OTP Verify करके Login करें
    </button>

  </div>

  <p id="loginStatus"></p>

</div>


<!-- USERS -->

<div id="userScreen">

  <div class="header">

    MyChat

    <button onclick="logout()"
      style="float:right;background:white;color:#128C7E;border:0;padding:8px;border-radius:6px">
      Logout
    </button>

  </div>


  <!-- MY PROFILE -->

  <div class="profileBox">

    <h3>My Profile</h3>

    <img id="myProfilePhoto"
      src="https://via.placeholder.com/90">

    <button class="profileButton"
      onclick="document.getElementById('profileInput').click()">
      📷 Profile Photo
    </button>

    <input
      type="file"
      id="profileInput"
      accept="image/*"
      onchange="selectProfilePhoto(event)">

    <input
      id="profileName"
      type="text"
      placeholder="अपना नाम लिखें">

    <button
      class="profileButton"
      onclick="saveProfile()">
      💾 Save Profile
    </button>

    <div id="profileStatus"></div>

  </div>


  <div id="status"
       style="padding:15px;text-align:center">
    Users लोड हो रहे हैं...
  </div>

  <div id="users"></div>

</div>


<!-- CHAT -->

<div id="chatScreen">

  <div class="chatHeader">

    <button class="back"
      onclick="backToUsers()">
      ←
    </button>

    <img id="chatProfilePhoto"
      src="https://via.placeholder.com/40">

    <div style="flex:1">

      <div id="chatName">
        Chat
      </div>

      <div id="chatOnlineStatus">
        Offline
      </div>
      <button onclick="startAudioCall()"
  style="background:white;border:0;border-radius:6px;padding:8px;font-size:18px">
  📞
</button>

<button onclick="startVideoCall()"
  style="background:white;border:0;border-radius:6px;padding:8px;font-size:18px">
  📹
</button>

    </div>

  </div>

  <div id="messages"></div>

  <div id="photoStatus"></div>

  <div class="bottom">

    <button id="photoButton"
      onclick="document.getElementById('photoInput').click()">
      📷
    </button>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      onchange="sendPhoto(event)">

    <input id="messageInput"
      placeholder="Message लिखें..."
      onkeydown="handleEnter(event)">

    <button id="sendButton"
      onclick="sendMessage()">
      Send
    </button>

  </div>

</div>


<script type="module">

  
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut,
  signInWithPhoneNumber,
  RecaptchaVerifier
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
  


import {
  getDatabase,
  ref,
  get,
  push,
  set,
  onValue,
  onDisconnect,
  onChildAdded,
  update
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";



/* FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyDJlc0BcaRyPtdFb9d-SNOPqwwuf2BylwU",

  authDomain: "mychat-8ab46.firebaseapp.com",

  databaseURL:
  "https://mychat-8ab46-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId: "mychat-8ab46",

  storageBucket: "mychat-8ab46.firebasestorage.app",

  messagingSenderId: "186347252945",

  appId: "1:186347252945:web:e901cc8c5a16339e1a29f0"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);


let currentUser = null;
let selectedUser = null;
let chatId = "";
let profilePhotoData = "";



/* PHONE OTP LOGIN */

let confirmationResult = null;
let recaptchaVerifier = null;

window.sendOTP = async function() {
  const input = document.getElementById("loginPhone");
  const status = document.getElementById("loginStatus");

  let phone = input.value.trim().replace(/[\s()-]/g, "");

  if (/^\d{10}$/.test(phone)) {
    phone = "+91" + phone;
  }

  if (!/^\+\d{10,15}$/.test(phone)) {
    status.innerText = "सही मोबाइल नंबर और country code डालें।";
    return;
  }

  status.innerText = "OTP भेजा जा रहा है...";

  try {
    if (!recaptchaVerifier) {
      recaptchaVerifier = new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        { size: "normal" }
      );
    }

    confirmationResult = await signInWithPhoneNumber(
      auth,
      phone,
      recaptchaVerifier
    );

    document.getElementById("otpSection").style.display = "block";
    status.innerText = "OTP SMS से भेज दिया गया है।";
  } catch (error) {
    status.innerText = "OTP Error: " + error.message;

    if (recaptchaVerifier) {
      recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }
  }
};

window.verifyOTP = async function() {
  const code = document.getElementById("loginOTP").value.trim();
  const status = document.getElementById("loginStatus");

  if (!confirmationResult) {
    status.innerText = "पहले OTP भेजें।";
    return;
  }

  if (!/^\d{6}$/.test(code)) {
    status.innerText = "6 अंकों का OTP डालें।";
    return;
  }

  status.innerText = "OTP जाँचा जा रहा है...";

  try {
    await confirmationResult.confirm(code);
    status.innerText = "Login सफल हुआ!";
  } catch (error) {
    status.innerText = "OTP Error: " + error.message;
  }
};


/* LOGOUT */

window.logout = async function() {
  try {
    await signOut(auth);
    alert("Logout सफल हुआ। अब दूसरे अकाउंट से Login करें।");
  } catch (error) {
    alert("Logout Error: " + error.message);
  }
};



/* AUTH */

onAuthStateChanged(
  auth,
  function(user) {

    if (!user) {

      currentUser = null;

      document.getElementById(
        "loginScreen"
      ).style.display = "block";

      document.getElementById(
        "userScreen"
      ).style.display = "none";

      document.getElementById(
        "chatScreen"
      ).style.display = "none";

      return;
    }


    currentUser = user;


    document.getElementById(
      "loginScreen"
    ).style.display = "none";

    document.getElementById(
      "userScreen"
    ).style.display = "block";

    document.getElementById(
      "chatScreen"
    ).style.display = "none";


    setOnlineStatus();

    loadMyProfile();

    watchUsers();
    watchIncomingCalls();

  }
);


/* ONLINE / OFFLINE */

async function setOnlineStatus() {

  if (!currentUser) return;


  const myStatusRef =
    ref(
      db,
      "users/" +
      currentUser.uid +
      "/online"
    );


  const connectedRef =
    ref(
      db,
      ".info/connected"
    );


  onValue(
    connectedRef,
    async function(snapshot) {

      if (snapshot.val() !== true) {

        return;

      }


      await onDisconnect(
        myStatusRef
      ).set(false);


      await set(
        myStatusRef,
        true
      );

    }
  );

}


/* WATCH USERS */

function watchUsers() {

  const usersRef =
    ref(db, "users");


  onValue(
    usersRef,
    function(snapshot) {

      displayUsers(snapshot);

    }
  );

}


/* DISPLAY USERS */

function displayUsers(snapshot) {

  const status =
    document.getElementById("status");


  const usersBox =
    document.getElementById("users");


  usersBox.innerHTML = "";


  let found = false;


  snapshot.forEach(
    function(child) {

     const user = {
  ...child.val(),
  uid: child.key
};

      if (
        currentUser &&
        user.uid !== currentUser.uid
      ) {

        found = true;


        const div =
          document.createElement("div");


        div.className =
          "user";


        const photo =
          user.photo ||
          "https://via.placeholder.com/55";


        const onlineText =
          user.online === true
            ? "🟢 Online"
            : "⚪ Offline";


        const onlineClass =
          user.online === true
            ? "online"
            : "offline";


        div.innerHTML = `

          <img
            class="profilePhoto"
            src="${photo}">

          <div class="userInfo">

            <b>
              ${user.name || "User"}
            </b>

            <div class="email">
              ${user.email || ""}
            </div>

            <div class="onlineStatus ${onlineClass}">
              ${onlineText}
            </div>

          </div>

          <button class="chatButton">
            Chat
          </button>

        `;


        div.querySelector(
          ".chatButton"
        ).onclick =
        function() {

          openChat(user);

        };


        usersBox.appendChild(div);

      }

    }
  );


  if (!found) {

    status.innerText =
      "दूसरा User अभी नहीं है";

  } else {

    status.innerText = "";

  }

}


/* LOAD MY PROFILE */

async function loadMyProfile() {

  try {

    const snapshot =
      await get(
        ref(
          db,
          "users/" +
          currentUser.uid
        )
      );


    if (snapshot.exists()) {

      const user =
        snapshot.val();


      document.getElementById(
        "profileName"
      ).value =
        user.name || "";


      if (user.photo) {

        profilePhotoData =
          user.photo;

        document.getElementById(
          "myProfilePhoto"
        ).src =
          user.photo;

      }

    }

  } catch(error) {

    document.getElementById(
      "profileStatus"
    ).innerText =
      "Profile Load Error: " +
      error.message;

  }

}


/* SELECT PROFILE PHOTO */

window.selectProfilePhoto =
function(event) {

  const file =
    event.target.files[0];


  if (!file) return;


  if (file.size > 500 * 1024) {

    alert(
      "Profile Photo 500 KB से छोटी रखें।"
    );

    event.target.value = "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
  function() {

    profilePhotoData =
      reader.result;


    document.getElementById(
      "myProfilePhoto"
    ).src =
      profilePhotoData;

  };


  reader.readAsDataURL(file);

};


/* SAVE PROFILE */

window.saveProfile =
async function() {

  const name =
    document.getElementById(
      "profileName"
    ).value.trim();


  const status =
    document.getElementById(
      "profileStatus"
    );


  if (!name) {

    status.innerText =
      "पहले अपना नाम लिखें";

    return;

  }


  status.innerText =
    "Profile Save हो रही है...";


  try {

    await set(
      ref(
        db,
        "users/" +
        currentUser.uid
      ),
      {

        uid:
          currentUser.uid,

        name:
          name,

        email:
          currentUser.email,

        photo:
          profilePhotoData || "",

        online:
          true,

        updatedAt:
          Date.now()

      }
    );


    status.innerText =
      "Profile Save हो गई ✓";


  } catch(error) {

    status.innerText =
      "Profile Error: " +
      error.message;

  }

};


/* BACK TO USERS — FIX */

function showUsersScreen() {
  document.getElementById("chatScreen").style.display = "none";
  document.getElementById("userScreen").style.display = "block";

  selectedUser = null;
  chatId = "";
}

window.backToUsers = function() {
  if (window.location.hash === "#chat") {
    window.history.back();
  } else {
    showUsersScreen();
  }
};

window.addEventListener("popstate", function() {
  if (document.getElementById("chatScreen").style.display !== "none") {
    showUsersScreen();
  }
});





/* OPEN CHAT */


window.openChat = function(user) {
  if (window.location.hash !== "#chat") {
  window.history.pushState({ screen: "chat" }, "", "#chat");
  }
  if (!user || !user.uid) {
    alert("इस User की Firebase ID नहीं मिली।");
    return;
  }

  selectedUser = {
    ...user,
    uid: String(user.uid)
  };

  window.currentChatUser = selectedUser;
  


  document.getElementById(
    "userScreen"
  ).style.display =
    "none";


  document.getElementById(
    "chatScreen"
  ).style.display =
    "block";


  document.getElementById(
    "chatName"
  ).innerText =
    user.name ||
    user.email ||
    "Chat";


  document.getElementById(
    "chatProfilePhoto"
  ).src =
    user.photo ||
    "https://via.placeholder.com/40";


  updateChatOnlineStatus(
    user.online
  );


  const ids = [

    currentUser.uid,
    user.uid

  ];


  ids.sort();


  chatId =
    ids[0] +
    "_" +
    ids[1];


  document.getElementById(
    "messages"
  ).innerHTML = "";


  loadMessages();

};


/* CHAT ONLINE STATUS */

function updateChatOnlineStatus(
  isOnline
) {

  const status =
    document.getElementById(
      "chatOnlineStatus"
    );


  if (isOnline === true) {

    status.innerText =
      "🟢 Online";

  } else {

    status.innerText =
      "⚪ Offline";

  }

}


/* MESSAGES */

function loadMessages() {

  const messagesRef =
    ref(
      db,
      "chats/" +
      chatId +
      "/messages"
    );


  onChildAdded(
    messagesRef,
    function(snapshot) {

      showMessage(
        snapshot.val()
      );

    }
  );

}


/* SHOW MESSAGE */

function showMessage(message) {

  const row =
    document.createElement("div");


  const box =
    document.createElement("div");


  const mine =
    message.senderId ===
    currentUser.uid;


  row.className =
    mine
      ? "messageRow myRow"
      : "messageRow otherRow";


  box.className =
    mine
      ? "message myMessage"
      : "message";


  if (message.type === "photo") {

    const image =
      document.createElement("img");


    image.src =
      message.photo;


    image.className =
      "chatPhoto";


    box.appendChild(image);

  }


  if (message.type !== "photo") {

    box.innerText =
      message.text || "";

  }


  const time =
    document.createElement("div");


  time.className =
    "messageTime";


  time.innerText =
    new Date(
      message.time
    ).toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  box.appendChild(time);


  row.appendChild(box);


  document.getElementById(
    "messages"
  ).appendChild(row);


  window.scrollTo(
    0,
    document.body.scrollHeight
  );

}


/* SEND TEXT */

window.sendMessage =
async function() {

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if (!text) return;


  if (!selectedUser) {

    alert(
      "पहले Chat खोलें"
    );

    return;

  }


  try {

    await push(
      ref(
        db,
        "chats/" +
        chatId +
        "/messages"
      ),
      {

        type:
          "text",

        text:
          text,

        senderId:
          currentUser.uid,

        senderName:
          currentUser.email,

        time:
          Date.now()

      }
    );


    input.value = "";


  } catch(error) {

    alert(
      "Message Error: " +
      error.message
    );

  }

};


/* SEND PHOTO */

window.sendPhoto =
function(event) {

  const file =
    event.target.files[0];


  if (!file) return;


  if (!selectedUser) {

      "पहले Chat खोलें"

  }


  const status =

  status.style.display =
    "block";


  const reader =
    new FileReader();


  reader.onload =
  async function() {

    try {

      await push(
        ref(
          db,
          "chats/" +
          chatId +
          "/messages"
        ),
        {

          type:
            "photo",

          photo:
            reader.result,

          senderId:
            currentUser.uid,

          senderName:
            currentUser.email,

            Date.now()

  };

  reader.readAsDataURL(file);
  };
  
  
/* AUDIO AND VIDEO CALLS */

let activeCallId = null;
let activeCallRole = null;
let activeCallType = "audio";
let incomingCallId = null;
let localCallStream = null;
let callPeer = null;
let incomingCallsUnsub = null;
let callWatchUnsub = null;
let remoteCandidatesUnsub = null;

const callConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

function showCallScreen(type) {
  document.getElementById("callScreen").style.display = "block";
  document.getElementById("remoteVideo").style.display =
    type === "video" ? "block" : "none";
  document.getElementById("localVideo").style.display =
    type === "video" ? "block" : "none";
  document.getElementById("callTitle").innerText =
    type === "video" ? "Video Call" : "Audio Call";
}

async function prepareCall(type, callId, role) {
  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    throw new Error(
      "Camera/Microphone unavailable. Open MyChat on HTTPS."
    );
  }

  localCallStream = await navigator.mediaDevices.getUserMedia({
    audio: true,
    video: type === "video"
  });

  callPeer = new RTCPeerConnection(callConfig);

  localCallStream.getTracks().forEach(function(track) {
    callPeer.addTrack(track, localCallStream);
  });

  if (type === "video") {
    document.getElementById("localVideo").srcObject = localCallStream;
  }

  callPeer.ontrack = function(event) {
    document.getElementById("remoteAudio").srcObject = event.streams[0];
    document.getElementById("remoteVideo").srcObject = event.streams[0];
  };

  callPeer.onicecandidate = async function(event) {
    if (event.candidate) {
      try {
        await push(
          ref(db, "callCandidates/" + callId + "/" + role),
          event.candidate.toJSON()
        );
      } catch (error) {
        console.log("ICE candidate error:", error.message);
      }
    }
  };
}

function listenRemoteCandidates(callId, remoteRole) {
  if (remoteCandidatesUnsub) remoteCandidatesUnsub();

  remoteCandidatesUnsub = onChildAdded(
    ref(db, "callCandidates/" + callId + "/" + remoteRole),
    async function(snapshot) {
      if (!callPeer || !callPeer.remoteDescription) return;

      try {
        await callPeer.addIceCandidate(
          new RTCIceCandidate(snapshot.val())
        );
      } catch (error) {
        console.log("Remote candidate error:", error.message);
      }
    }
  );
}

window.startAudioCall = function() {
  startCall("audio");
};

window.startVideoCall = function() {
  startCall("video");
};

async function startCall(type) {
  if (!currentUser || !selectedUser || !currentUser.uid || !selectedUser.uid) {
alert("User की जानकारी नहीं मिली। वापस जाकर दूसरे User की Chat फिर से खोलें।");
return;
}

if (selectedUser.uid === currentUser.uid) {
alert("दूसरे अलग अकाउंट को Call करें।");
return;
}

  if (selectedUser.uid === currentUser.uid) {
    alert("दूसरे अलग अकाउंट को Call करें।");
    return;
  }

  if (callPeer) {
    alert("पहले चल रही Call समाप्त करें।");
    return;
  }

  try {
    activeCallType = type;
    activeCallRole = "caller";

    const callRef = push(ref(db, "calls"));
    activeCallId = callRef.key;

    await set(callRef, {
      callerId: currentUser.uid,
      calleeId: selectedUser.uid,
      type: type,
      status: "preparing",
      createdAt: Date.now()
    });

    showCallScreen(type);
    document.getElementById("callTitle").innerText = "Calling...";

    await prepareCall(type, activeCallId, "caller");

    const offer = await callPeer.createOffer();
    await callPeer.setLocalDescription(offer);

    await update(callRef, {
      offer: {
        type: offer.type,
        sdp: offer.sdp
      },
      status: "ringing"
    });

    callWatchUnsub = onValue(callRef, async function(snapshot) {
      const data = snapshot.val();
      if (!data) return;

      if (data.answer && callPeer &&
          !callPeer.currentRemoteDescription) {
        try {
          await callPeer.setRemoteDescription(
            new RTCSessionDescription(data.answer)
          );
          listenRemoteCandidates(activeCallId, "callee");
          document.getElementById("callTitle").innerText =
            "Call connected";
        } catch (error) {
          console.log("Answer error:", error.message);
        }
      }

      if (data.status === "ended" || data.status === "rejected") {
        cleanupCall();
      }
    });

  } catch (error) {
    alert("Call Error: " + error.message);
    cleanupCall();
  }
}

/* INCOMING CALL LISTENER */

function watchIncomingCalls() {
  if (incomingCallsUnsub) return;

  incomingCallsUnsub = onValue(ref(db, "calls"), function(snapshot) {
    if (!currentUser) return;

    snapshot.forEach(function(child) {
      const data = child.val();

      if (
        data.calleeId === currentUser.uid &&
        data.callerId !== currentUser.uid &&
        data.status === "ringing" &&
        !callPeer
      ) {
        incomingCallId = child.key;
        document.getElementById("incomingCallTitle").innerText =
          (data.type === "video" ? "Video" : "Audio") +
          " Call incoming";
        document.getElementById("incomingCall").style.display = "block";
      }
    });
  });
}

window.answerCall = async function() {
  if (!incomingCallId) return;

  const callId = incomingCallId;
  const callRef = ref(db, "calls/" + callId);

  try {
    const snapshot = await get(callRef);
    const data = snapshot.val();

    if (!data || data.status !== "ringing") {
      alert("यह Call अब उपलब्ध नहीं है।");
      cleanupCall();
      return;
    }

    activeCallId = callId;
    activeCallRole = "callee";
    activeCallType = data.type || "audio";

    document.getElementById("incomingCall").style.display = "none";
    showCallScreen(activeCallType);

    await prepareCall(activeCallType, callId, "callee");

    await callPeer.setRemoteDescription(
      new RTCSessionDescription(data.offer)
    );

    listenRemoteCandidates(callId, "caller");

    const answer = await callPeer.createAnswer();
    await callPeer.setLocalDescription(answer);

    await update(callRef, {
      answer: {
        type: answer.type,
        sdp: answer.sdp
      },
      status: "answered"
    });

    document.getElementById("callTitle").innerText = "Call connected";

  } catch (error) {
    alert("Answer Error: " + error.message);
    cleanupCall();
  }
};

window.rejectCall = async function() {
  if (incomingCallId) {
    try {
      await update(ref(db, "calls/" + incomingCallId), {
        status: "rejected"
      });
    } catch (error) {
      console.log(error.message);
    }
  }

  document.getElementById("incomingCall").style.display = "none";
  incomingCallId = null;
};

window.endCall = async function() {
  const callId = activeCallId;

  if (callId) {
    try {
      await update(ref(db, "calls/" + callId), {
        status: "ended"
      });
    } catch (error) {
      console.log(error.message);
    }
  }

  cleanupCall();
};

function cleanupCall() {
  if (callWatchUnsub) callWatchUnsub();
  if (remoteCandidatesUnsub) remoteCandidatesUnsub();

  callWatchUnsub = null;
  remoteCandidatesUnsub = null;

  if (callPeer) callPeer.close();
  callPeer = null;

  if (localCallStream) {
    localCallStream.getTracks().forEach(function(track) {
      track.stop();
    });
  }
  localCallStream = null;

  document.getElementById("callScreen").style.display = "none";
  document.getElementById("incomingCall").style.display = "none";
  document.getElementById("remoteAudio").srcObject = null;
  document.getElementById("remoteVideo").srcObject = null;
  document.getElementById("localVideo").srcObject = null;

  activeCallId = null;
  activeCallRole = null;
  incomingCallId = null;
}

/* START LISTENING AFTER LOGIN */

window.startAudioCall = function() {
  startCall("audio");
};

</script>
